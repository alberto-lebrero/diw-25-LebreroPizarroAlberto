<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 48</title>

        <style>
            .container {
                display: grid;
                grid-gap: 1px;
                grid-template-columns: repeat(4, 100px);
                grid-template-areas: 
                    "cell1 cell1 cell2 cell2"
                    "cell3 cell4 cell4 cell4"
                    "cell5 cell5 cell5 cell5";
                    margin: 0 auto;
            }

            .container div {
                background-color: grey;
                color: white;
                padding: 18px;
                text-align: center;
            }

            .cell1 {
                grid-area: cell1;
            }

            .cell2 {
                grid-area: cell2;
            }

            .cell3 {
                grid-area: cell3;
            }

            .cell4 {
                grid-area: cell4;
            }

            .cell5 {
                grid-area: cell5;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="cell1">celda 1</div>
            <div class="cell2">celda 2</div>
            <div class="cell3">celda 3</div>
            <div class="cell4">celda 4</div>
            <div class="cell5">celda 5</div>
        </div>
    </body>
</html>
