<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 46</title>

        <style>
            .container {
                display: grid;
                grid-gap: 1px;
                grid-template-columns: 100px repeat(4, 1fr);
                grid-template-areas: 
                    "header header header header header"
                    "sidebar cell1 cell1 cell2 cell2"
                    "sidebar cell3 cell3 cell4 cell4";
                justify-items: stretch;
            }

            .container div {
                background-color: grey;
                color: white;
                text-align: center;
                padding: 20px;
            }

            .header {
                grid-area: header;
            }

            .sidebar {
                grid-area: sidebar;
            }

            .cell1 {
                grid-area: cell1;
            }

            .cell2{
                grid-area: cell2;
            }

            .cell3 {
                grid-area: cell3;
            }

            .cell4 {
                grid-area: cell4;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">celda 1</div>
            <div class="sidebar">celda 2</div>
            <div class="cell1">celda 3</div>
            <div class="cell2">celda 4</div>
            <div class="cell3">celda 5</div>
            <div class="cell4">celda 6</div>
        </div>
    </body>
</html>
