<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 50</title>

        <style>
            .container {
                display: grid;
                grid-gap: 1px;
                grid-template-columns: repeat(3, 200px);
                margin: 0 auto;
            }

            .container div {
                background-color: grey;
                color: white;
                padding: 20px;
                text-align: left;
            }

             .cell1 {
                grid-row: 2;
                grid-column: 3;
                /*También se podría poner: 
                    order: 2;*/
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="cell1">celda 1</div>
            <div>celda 2</div>
            <div>celda 3</div>
            <div>celda 4</div>
            <div>celda 5</div>
            <div>celda 6</div>
        </div>
    </body>
</html>
