<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 44</title>

        <style>
            .container {
                display: grid;
                grid-template-areas: 
                    "header header header";
                grid-template-columns: repeat(3, 150px);
                margin: 0 auto;
                grid-gap: 1px;
            }

            .container div {
                background-color: grey;
                color: white;
                text-align: center;
                padding: 20px;
            }

            .header {
                grid-area: header;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">celda 1</div>
            <div>celda 2</div>
            <div>celda 3</div>
            <div>celda 4</div>
            <div>celda 5</div>
            <div>celda 6</div>
            <div>celda 7</div>
        </div>
    </body>
</html>
