<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 52</title>

        <style>
            .container {
                display: grid;
                grid-gap: 1px;
                grid-template-columns: repeat(3, 100px);
                grid-template: 
                    "cell1 cell2 cell2"
                    "cell3 cell4 cell4"
                    "cell5 cell4 cell4";
                margin: 0 auto;
                width: 500px;
            }

            .container div {
                background-color: grey;
                color: white;
                padding: 20px;
                text-align: center;
            }

            .cell1 {
                grid-area: cell1;
            }

            .cell2 {
                grid-area: cell2;
            }

            .cell3 {
                grid-area: cell3;
            }

            .cell4 {
                grid-area: cell4;
            }

            .lists {
                display: grid;
                grid-gap: 1px;
                background-color: white;
                grid-template: ' a a ' auto;
            }

            .item1 {
                grid-area: a;
            }

            .lists div {
                background-color: #DBDAF5;
                padding: 18px;
                color: black;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="cell1">celda 1</div>
            <div class="cell2">celda 2</div>
            <div class="cell3">celda 3</div>
            <div class="cell4">
                <div class="lists">
                    <div class="item1">Grid Anidado</div>
                    <div class="item2">Lista 2</div>
                    <div class="item3">Lista 3</div>
                    <div class="item4">Lista 4</div>
                    <div class="item5">Lista 5</div>
                </div>
            </div>
            <div>celda 5</div>
        </div>
    </body>
</html>
