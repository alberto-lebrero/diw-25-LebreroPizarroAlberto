<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 47</title>

        <style>
            .container {
                display: grid;
                grid-gap: 1px;
                grid-template-columns: repeat(5, 150px);
                grid-template-areas: 
                    "header header header sidebar"
                    "cell3 cell4 cell5 sidebar";
            }

            .container div {
                background-color: grey;
                color: white;
                text-align: center;
                padding: 18px;
            }

            .header {
                grid-area: header;
            }

            .sidebar {
                grid-area: sidebar;
            }

            .cell3 {
                grid-area: cell3;
            }

            .cell4 {
                grid-area: cell4;
            }

            .cell5 {
                grid-area: cell5;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">celda 1</div>
            <div class="sidebar">celda 2</div>
            <div class="cell3">celda 3</div>
            <div class="cell4">celda 4</div>
            <div class="cell5">celda 5</div>
        </div>
    </body>
</html>
